<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">

              "display": ["Spline Sans"]

<span class="material-symbols-outlined text-3xl fill-1">bedtime</span>
</div>

</div>

</div>

<div class="flex flex-col min-w-[120px] aspect-square items-center justify-center bg-slate-100 dark:bg-slate-800 rounded-lg relative border border-slate-200 dark:border-slate-700 grayscale">

<div class="w-20 h-20 bg-center bg-no-repeat bg-contain opacity-40" data-alt="Viking helmet with horns" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCJPlEMbqGu6Yu7NvpcZpNiUS3zzzH9HAHlLSqno6ClZrmZ6-Bjs-K69RZRTy9JdWdicvBdlqDjU6Yr4K0b_0NRUd0adXw-yvbsgAeergSl2rTr1uAN3LWN62hoZ47666EokQ2T17bMAUiCkn9ek1mbpE1uUeo-Nl8p2AC6bC8yQfp23pxuub_3pDVdzR3saN0uBvLmZ_JojdVmfSCfstOsAVoVL3BIHTenGV7-fOc7wL5JsUT3YuH_raZkiKOCccObmqyB9kFFZWay");'>

<div class="flex items-center bg-accent-yellow/90 px-2 py-0.5 rounded-full shadow-sm">

</div>
</div>

<button class="flex w-full max-w-[320px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-20 px-8 bg-accent-green text-white gap-3 shadow-xl shadow-accent-green/30 border-b-8 border-green-700 active:translate-y-1 active:border-b-4 transition-all">
<span class="material-symbols-outlined text-4xl font-bold">check_circle</span>

</div>
</div>
<style>
