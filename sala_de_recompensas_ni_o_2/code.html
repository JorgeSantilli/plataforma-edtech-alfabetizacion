<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400,700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4b8fe2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121820",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .shelf-gradient {
            background: linear-gradient(to bottom, #8b5e34 0%, #634121 100%);
        }
        .magic-glow {
            box-shadow: 0 0 20px rgba(75, 143, 226, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.5; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .sound-pulse::before {
    content: '';
    position: absolute;
    inset: -10px;
    border: 2px solid currentColor;
    border-radius: 9999px;
    animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
</style></head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-primary/10 bg-background-light dark:bg-background-dark">
<!-- Header / Status Bar -->
<div class="flex items-center justify-between p-6 pb-2">
<div class="flex items-center gap-2 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm border border-primary/10">
<span class="material-symbols-outlined text-yellow-400 fill-1 font-bold">stars</span>
<span class="text-slate-900 dark:text-slate-100 font-extrabold text-xl">125</span>
</div>
<div class="flex items-center gap-2 bg-primary/10 dark:bg-primary/20 px-4 py-2 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-primary font-bold">database</span>
<span class="text-primary font-extrabold text-xl">450</span>
</div>
</div>
<!-- Title -->
<div class="px-6 pt-4 pb-2 text-center">
<h1 class="text-primary text-4xl font-extrabold tracking-tight drop-shadow-sm">¡Mis Logros!</h1>
</div>
<!-- Trophy Showcase / Magic Shelf -->
<div class="flex-1 px-4 py-4 overflow-y-auto">
<div class="relative bg-primary/5 dark:bg-slate-800/50 rounded-xl p-6 border-2 border-primary/20 min-h-[400px]">
<!-- Trophy Grid -->
<div class="grid grid-cols-2 gap-8 mb-8">
<!-- Trophy 1 -->
<div class="flex flex-col items-center">
<div class="relative group cursor-pointer active:scale-95 transition-transform">
<div class="absolute inset-0 bg-yellow-400/20 blur-xl rounded-full scale-125"></div>
<div class="bg-white dark:bg-slate-700 w-32 h-32 rounded-full flex items-center justify-center shadow-lg border-4 border-yellow-400 relative z-10 cursor-pointer active:scale-95 transition-transform sound-pulse text-yellow-400/30">
<span class="material-symbols-outlined text-6xl text-yellow-500 fill-1">trophy</span>
<div class="absolute -top-2 -right-2 bg-yellow-400 text-white rounded-full p-1 shadow-lg animate-bounce">
<span class="material-symbols-outlined text-sm">graphic_eq</span>
</div></div>
</div>
<p class="mt-3 text-slate-900 dark:text-slate-100 font-bold text-center">Copa de Oro</p>
</div>
<!-- Trophy 2 -->
<div class="flex flex-col items-center">
<div class="relative cursor-pointer active:scale-95 transition-transform group">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-125"></div>
<div class="bg-white dark:bg-slate-700 w-32 h-32 rounded-full flex items-center justify-center shadow-lg border-4 border-primary/40 relative z-10 cursor-pointer active:scale-95 transition-transform sound-pulse text-yellow-400/30">
<span class="material-symbols-outlined text-6xl text-primary fill-1">military_tech</span>
<div class="absolute -top-2 -right-2 bg-primary text-white rounded-full p-1 shadow-lg opacity-0 group-active:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm">graphic_eq</span>
</div></div>
</div>
<p class="mt-3 text-slate-900 dark:text-slate-100 font-bold text-center">Medalla Pro</p>
</div>
<!-- Trophy 3 -->
<div class="flex flex-col items-center">
<div class="relative cursor-pointer active:scale-95 transition-transform group">
<div class="bg-white dark:bg-slate-700 w-32 h-32 rounded-full flex items-center justify-center shadow-lg border-4 border-orange-400/50 relative z-10 cursor-pointer active:scale-95 transition-transform sound-pulse text-yellow-400/30">
<span class="material-symbols-outlined text-6xl text-orange-400 fill-1">workspace_premium</span>
<div class="absolute -top-2 -right-2 bg-orange-400 text-white rounded-full p-1 shadow-lg opacity-0 group-active:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm">graphic_eq</span>
</div></div>
</div>
<p class="mt-3 text-slate-900 dark:text-slate-100 font-bold text-center">Estrella</p>
</div>
<!-- Trophy 4 (Locked) -->
<div class="flex flex-col items-center opacity-40">
<div class="bg-slate-200 dark:bg-slate-600 w-32 h-32 rounded-full flex items-center justify-center shadow-inner relative z-10 border-4 border-slate-300 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-6xl text-slate-400">lock</span>
</div>
<p class="mt-3 text-slate-500 dark:text-slate-400 font-bold text-center">???</p>
</div>
</div>
<!-- Visual Shelf Decoration -->
<div class="absolute bottom-10 left-0 right-0 h-4 shelf-gradient rounded-full mx-4 shadow-xl"></div>
</div>
</div>
<!-- Badges Horizontal Scroll -->
<div class="px-6 py-4">
<h3 class="text-slate-600 dark:text-slate-400 font-bold text-sm uppercase tracking-widest mb-3 text-center">Mis Emblemas</h3>
<div class="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
<div class="flex-shrink-0 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center border-2 border-green-500">
<span class="material-symbols-outlined text-green-600">bolt</span>
</div>
<span class="text-xs font-bold text-slate-700 dark:text-slate-300">Veloz</span>
</div>
<div class="flex-shrink-0 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-full bg-pink-100 dark:bg-pink-900/30 flex items-center justify-center border-2 border-pink-500">
<span class="material-symbols-outlined text-pink-600">favorite</span>
</div>
<span class="text-xs font-bold text-slate-700 dark:text-slate-300">Amigo</span>
</div>
<div class="flex-shrink-0 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center border-2 border-blue-500">
<span class="material-symbols-outlined text-blue-600">explore</span>
</div>
<span class="text-xs font-bold text-slate-700 dark:text-slate-300">Viajero</span>
</div>
<div class="flex-shrink-0 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center border-2 border-yellow-500">
<span class="material-symbols-outlined text-yellow-600">lightbulb</span>
</div>
<span class="text-xs font-bold text-slate-700 dark:text-slate-300">Genio</span>
</div>
</div>
</div>
<!-- Bottom Navigation -->
<div class="p-6 pt-2 pb-10">
<button class="w-full bg-primary hover:bg-primary/90 text-white flex items-center justify-center gap-3 py-5 rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-95">
<span class="material-symbols-outlined text-3xl font-bold">home</span>
<span class="text-2xl font-black">Volver al Mapa</span>
</button>
</div>
</div>
<!-- Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden opacity-50">
<div class="absolute top-10 left-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-20 right-10 w-64 h-64 bg-yellow-400/5 rounded-full blur-3xl"></div>
</div>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
