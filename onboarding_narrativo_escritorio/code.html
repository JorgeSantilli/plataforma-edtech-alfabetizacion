<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4b8fe2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121820",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Spline Sans', sans-serif;
        }
        .voice-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
        }
        .wave-bar {
            width: 4px;
            background-color: #4b8fe2;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="layout-container flex h-full grow flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-8 py-6 lg:px-20 bg-white/50 dark:bg-slate-800/50 backdrop-blur-md">
<div class="flex items-center gap-4">
<div class="size-10 bg-primary rounded-full flex items-center justify-center text-white">
<span class="material-symbols-outlined text-2xl">auto_stories</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight tracking-tight">Narrative Kids</h2>
</div>
<div class="flex items-center gap-6">
<!-- Progress Dots -->
<div class="flex gap-2">
<div class="size-3 rounded-full bg-primary"></div>
<div class="size-3 rounded-full bg-primary/30"></div>
<div class="size-3 rounded-full bg-primary/30"></div>
<div class="size-3 rounded-full bg-primary/30"></div>
</div>
<button class="flex items-center justify-center rounded-full size-12 bg-white dark:bg-slate-700 text-primary shadow-sm hover:shadow-md transition-shadow">
<span class="material-symbols-outlined">help</span>
</button>
<div class="size-12 rounded-full border-2 border-primary p-0.5">
<div class="w-full h-full rounded-full bg-center bg-cover" data-alt="Profile avatar of a smiling child" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDHZvXQSwf2Vg5JtXVjw83bWh13gwzB4pfB89VZISjiPJpHMxFQhLqZEdi1SMu5synLgm919NZKy51L68d_LrdtatsMGgvUJNpRGkH8s2n5KT5p4razqb6X16p-Zh1jBvhv6mQADBhDOCLMZrWDqBn6vWl7Ts2m9R5kyrh0y9zPXG2W6kglDWaps9uHxRDdFsIbGi3pYX7wYLLxYx0_zavuHUBBAzs80eovsWU0iV_wZPmj7jcE0NUSG4zxJtOzGjW-RBMQ5-Qq7Ieb");'></div>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-4 relative overflow-hidden">
<!-- Nature Background Elements (Abstract) -->
<div class="absolute top-20 left-10 opacity-20 dark:opacity-10">
<span class="material-symbols-outlined text-[120px] text-green-500">park</span>
</div>
<div class="absolute bottom-10 right-20 opacity-20 dark:opacity-10">
<span class="material-symbols-outlined text-[160px] text-yellow-500">wb_sunny</span>
</div>
<div class="absolute bottom-20 left-40 opacity-20 dark:opacity-10">
<span class="material-symbols-outlined text-[100px] text-primary">cloud</span>
</div>
<div class="max-w-4xl w-full flex flex-col items-center gap-12 z-10">
<!-- Mentor Avatar Section -->
<div class="flex flex-col items-center gap-6">
<div class="relative">
<div class="size-48 lg:size-64 bg-primary/10 rounded-full flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-xl overflow-hidden">
<div class="w-full h-full bg-center bg-contain bg-no-repeat p-4" data-alt="A friendly blue bird mentor character" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCWxXN2_B_kS02Poh6oWaNxpvcHbZuOc_mzrk-RegFt8c-WqS9nNbeasjweLXHhTnG076ALuBSAiAarNtqyO_Cy5Odjz5pOOyA4OWApLmAmTxK7TY-rEgb0oVti8wDNDcniWvT4GTmYiapm5w8JP5pyZQPuUKj2JhWk1BKnO0FAqlMiHT5u-ENPo_krv-tqSadNYL6sBviNvuPWgXT21jnaxjAhzkY1ppTOK-4ocWNLFvH0SYpg_NiNteNzD2Wp56iTo3kuoS24yt6-");'></div>
</div>
<!-- Speech Bubble -->
<div class="absolute -right-24 top-0 bg-white dark:bg-slate-800 p-6 rounded-xl rounded-bl-none shadow-lg max-w-xs border border-primary/10">
<p class="text-xl font-medium text-slate-800 dark:text-slate-200">"Hi there, little explorer! Are you ready to play?"</p>
</div>
</div>
</div>
<!-- Voice UI Waves -->
<div class="voice-wave">
<div class="wave-bar h-4"></div>
<div class="wave-bar h-8"></div>
<div class="wave-bar h-12"></div>
<div class="wave-bar h-16 bg-primary/60"></div>
<div class="wave-bar h-12"></div>
<div class="wave-bar h-20"></div>
<div class="wave-bar h-14"></div>
<div class="wave-bar h-8"></div>
<div class="wave-bar h-4"></div>
</div>
<!-- Main Action Button -->
<div class="flex flex-col items-center gap-4">
<button class="group flex items-center justify-center size-32 lg:size-40 bg-primary text-white rounded-full shadow-[0_20px_50px_rgba(75,143,226,0.3)] hover:scale-110 transition-transform active:scale-95 border-8 border-white dark:border-slate-900">
<span class="material-symbols-outlined text-6xl lg:text-7xl group-hover:scale-110 transition-transform">play_arrow</span>
</button>
<span class="text-2xl font-bold tracking-widest text-primary uppercase">Tap to Play</span>
</div>
</div>
</main>
<!-- Bottom Status Bar -->
<footer class="p-8 flex justify-center items-center">
<div class="bg-white/80 dark:bg-slate-800/80 backdrop-blur px-8 py-4 rounded-full border border-primary/20 flex items-center gap-4 shadow-sm">
<span class="material-symbols-outlined text-primary">mic</span>
<p class="text-slate-600 dark:text-slate-400 font-medium italic">Listening for your voice...</p>
</div>
</footer>
</div>
</body></html>
