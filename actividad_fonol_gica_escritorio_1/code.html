</div>

<div>
<h3 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Ant</h3>

<span class="material-symbols-outlined">play_arrow</span>

<button class="flex items-center justify-center gap-3 bg-primary text-white h-16 px-12 rounded-full font-bold text-lg hover:bg-primary/90 transition-all shadow-lg shadow-primary/30 group">

<svg fill="none" height="600" viewbox="0 0 600 600" width="600" xmlns="http://www.w3.org/2000/svg">
